name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: 
          - sf32lb52-superkey
      fail-fast: false
    
    name: Build ${{ matrix.target }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Extract version from commit message
      id: version
      run: |
        COMMIT_MSG="${{ github.event.head_commit.message }}"
        echo "Commit message: $COMMIT_MSG"
        
        # 检查是否包含 "release v*.*.*" 格式
        if [[ "$COMMIT_MSG" =~ release[[:space:]]+(v[0-9]+\.[0-9]+\.[0-9]+) ]]; then
          VERSION="${BASH_REMATCH[1]}"
          echo "Found version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "has_version=true" >> $GITHUB_OUTPUT
        else
          echo "No version found in commit message"
          echo "has_version=false" >> $GITHUB_OUTPUT
        fi

    - name: Extract version from tag
      id: tag_version
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        TAG_VERSION="${{ github.ref_name }}"
        echo "Tag version: $TAG_VERSION"
        echo "version=$TAG_VERSION" >> $GITHUB_OUTPUT
        echo "has_version=true" >> $GITHUB_OUTPUT
    
    - name: Setup build environment
      run: |
        cd SiFli-SDK
        ./install.sh
    
    - name: Build ${{ matrix.target }}
      run: |
        cd SiFli-SDK
        . ./export.sh
        cd -
        cd app/project
        scons --board=sf32lb52-superkey --board_search_path="../boards" -j$(nproc)
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.target }}
        path: |
          app/project/build_*
        retention-days: 7

    - name: Prepare release files (from commit message)
      if: steps.version.outputs.has_version == 'true'
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        mkdir -p release
        
        # 复制文件到临时目录
        mkdir -p release/SuperKey_${VERSION}
        cp app/project/build_${{ matrix.target }}_hcpu/bootloader/bootloader.bin release/SuperKey_${VERSION}/
        cp app/project/build_${{ matrix.target }}_hcpu/ftab/ftab.bin release/SuperKey_${VERSION}/
        
        # main.bin 现在是目录，包含 ER_IROM1/2/3.bin
        if [ -d "app/project/build_${{ matrix.target }}_hcpu/main.bin" ]; then
          mkdir -p release/SuperKey_${VERSION}/main.bin
          cp app/project/build_${{ matrix.target }}_hcpu/main.bin/*.bin release/SuperKey_${VERSION}/main.bin/
          echo "Copied main.bin directory (split bins)"
        elif [ -f "app/project/build_${{ matrix.target }}_hcpu/main.bin" ]; then
          cp app/project/build_${{ matrix.target }}_hcpu/main.bin release/SuperKey_${VERSION}/
          echo "Copied main.bin single file (legacy)"
        fi
        
        # 创建重命名的 zip 压缩包
        cd release
        zip -r SuperKey_${VERSION}.zip SuperKey_${VERSION}/
        echo "Created: SuperKey_${VERSION}.zip"
        echo "Contents:"
        unzip -l SuperKey_${VERSION}.zip

    - name: Create fw_verid.json (from commit message)
      if: steps.version.outputs.has_version == 'true'
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        COMMIT_SHA="${{ github.sha }}"
        
        cat > release/fw_verid.json << EOF
        {
          "version": "$VERSION",
          "build_time": "$BUILD_TIME",
          "commit": "${COMMIT_SHA:0:7}",
          "target": "${{ matrix.target }}"
        }
        EOF
        
        echo "[OK] Created fw_verid.json:"
        cat release/fw_verid.json

    - name: Create tag and release (from commit message)
      if: steps.version.outputs.has_version == 'true'
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        
        # 配置 git
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        
        # 创建并推送 tag（如果不存在）
        if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"
          echo "Created and pushed tag: $VERSION"
        else
          echo "Tag $VERSION already exists"
        fi

    - name: Upload release (from commit message)
      if: steps.version.outputs.has_version == 'true'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "release/SuperKey_${{ steps.version.outputs.version }}.zip"
        generateReleaseNotes: true
        allowUpdates: true
        artifactErrorsFailBuild: true
        name: "Release ${{ steps.version.outputs.version }}"
        tag: ${{ steps.version.outputs.version }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Prepare release files (from tag)
      if: startsWith(github.ref, 'refs/tags/') && steps.version.outputs.has_version != 'true'
      run: |
        VERSION="${{ github.ref_name }}"
        mkdir -p release
        
        # 复制文件到临时目录
        mkdir -p release/SuperKey_${VERSION}
        cp app/project/build_${{ matrix.target }}_hcpu/bootloader/bootloader.bin release/SuperKey_${VERSION}/
        cp app/project/build_${{ matrix.target }}_hcpu/ftab/ftab.bin release/SuperKey_${VERSION}/
        
        # main.bin 现在是目录，包含 ER_IROM1/2/3.bin
        if [ -d "app/project/build_${{ matrix.target }}_hcpu/main.bin" ]; then
          mkdir -p release/SuperKey_${VERSION}/main.bin
          cp app/project/build_${{ matrix.target }}_hcpu/main.bin/*.bin release/SuperKey_${VERSION}/main.bin/
          echo "Copied main.bin directory (split bins)"
        elif [ -f "app/project/build_${{ matrix.target }}_hcpu/main.bin" ]; then
          cp app/project/build_${{ matrix.target }}_hcpu/main.bin release/SuperKey_${VERSION}/
          echo "Copied main.bin single file (legacy)"
        fi
        
        # 创建重命名的 zip 压缩包
        cd release
        zip -r SuperKey_${VERSION}.zip SuperKey_${VERSION}/
        echo "Created: SuperKey_${VERSION}.zip"
        echo "Contents:"
        unzip -l SuperKey_${VERSION}.zip

    - name: Create fw_verid.json (from tag)
      if: startsWith(github.ref, 'refs/tags/') && steps.version.outputs.has_version != 'true'
      run: |
        VERSION="${{ github.ref_name }}"
        BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
        COMMIT_SHA="${{ github.sha }}"
        
        cat > release/fw_verid.json << EOF
        {
          "version": "$VERSION",
          "build_time": "$BUILD_TIME",
          "commit": "${COMMIT_SHA:0:7}",
          "target": "${{ matrix.target }}"
        }
        EOF
        
        echo "[OK] Created fw_verid.json:"
        cat release/fw_verid.json

    - name: Create Release (from tag)
      if: startsWith(github.ref, 'refs/tags/') && steps.version.outputs.has_version != 'true'
      uses: ncipollo/release-action@v1
      with:
        artifacts: "release/SuperKey_${{ github.ref_name }}.zip"
        generateReleaseNotes: true
        allowUpdates: true
        artifactErrorsFailBuild: true
        name: "Release ${{ github.ref_name }}"
        tag: ${{ github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}

    # ============================================================================
    # 同步到腾讯云 COS
    # ============================================================================
    - name: Prepare COS upload directories
      if: steps.version.outputs.has_version == 'true' || (startsWith(github.ref, 'refs/tags/') && steps.version.outputs.has_version != 'true')
      run: |
        # 确定版本号
        if [[ "${{ steps.version.outputs.has_version }}" == "true" ]]; then
          VERSION="${{ steps.version.outputs.version }}"
        else
          VERSION="${{ github.ref_name }}"
        fi
        
        echo "Preparing COS upload for version: $VERSION"
        
        # 创建版本目录（固件压缩包）
        mkdir -p cos_version_artifacts
        cp release/SuperKey_${VERSION}.zip cos_version_artifacts/
        
        # 创建根目录（只包含 fw_verid.json）
        mkdir -p cos_root_artifacts
        cp release/fw_verid.json cos_root_artifacts/
        
        echo "[PKG] Version artifacts:"
        ls -lh cos_version_artifacts/
        
        echo "[PKG] Root artifacts (fw_verid.json):"
        ls -lh cos_root_artifacts/
        
        # 保存版本号供后续步骤使用
        echo "release_version=$VERSION" >> $GITHUB_ENV

    - name: Upload firmware to COS (version directory)
      if: steps.version.outputs.has_version == 'true' || (startsWith(github.ref, 'refs/tags/') && steps.version.outputs.has_version != 'true')
      uses: OpenSiFli/SiFliMirrorSync@v1
      with:
        secret_id: ${{ secrets.COS_DOCS_SECRET_ID }}
        secret_key: ${{ secrets.COS_DOCS_SECRET_KEY }}
        region: ${{ secrets.COS_DOCS_REGION }}
        bucket: ${{ secrets.COS_DOCS_BUCKET }}
        prefix: projects/superkey/download/firmware/${{ env.release_version }}/
        artifacts: cos_version_artifacts/
        delete_remote: true

    - name: Upload fw_verid.json to COS (root directory)
      if: steps.version.outputs.has_version == 'true' || (startsWith(github.ref, 'refs/tags/') && steps.version.outputs.has_version != 'true')
      uses: OpenSiFli/SiFliMirrorSync@v1
      with:
        secret_id: ${{ secrets.COS_DOCS_SECRET_ID }}
        secret_key: ${{ secrets.COS_DOCS_SECRET_KEY }}
        region: ${{ secrets.COS_DOCS_REGION }}
        bucket: ${{ secrets.COS_DOCS_BUCKET }}
        prefix: projects/superkey/download/
        artifacts: cos_root_artifacts/
        delete_remote: false  # 不删除其他文件，只覆盖 fw_verid.json
        flush_url: "https://sparks.sifli.com/projects/superkey/download/cos_root_artifacts/fw_verid.json"
