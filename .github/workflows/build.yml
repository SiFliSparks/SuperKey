name: Build

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: 
          - sf32lb52-superkey
      fail-fast: false
    
    name: Build ${{ matrix.target }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive
    
    - name: Setup build environment
      run: |
        cd SiFli-SDK
        ./install.sh
    
    - name: Build ${{ matrix.target }}
      run: |
        cd SiFli-SDK
        . ./export.sh
        cd -
        cd app/project
        scons --board=sf32lb52-superkey --board_search_path="../boards" -j$(nproc)
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.target }}
        path: |
          app/project/build_*
        retention-days: 7

    - name: Prepare release files
      if: startsWith(github.ref, 'refs/tags/')
      run: |
        mkdir -p release/${{ matrix.target }}
        cp app/project/build_${{ matrix.target }}_hcpu/bootloader/bootloader.bin release/${{ matrix.target }}/
        cp app/project/build_${{ matrix.target }}_hcpu/ftab/ftab.bin release/${{ matrix.target }}/
        cp app/project/build_${{ matrix.target }}_hcpu/main.bin release/${{ matrix.target }}/
        # cp sftool_param.json release/${{ matrix.target }}/
        
        # Create a zip archive for this target
        cd release
        zip -r ${{ matrix.target }}.zip ${{ matrix.target }}/

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: ncipollo/release-action@v1
      with:
        artifacts: "release/${{ matrix.target }}.zip"
        generateReleaseNotes: true
        allowUpdates: true
        artifactErrorsFailBuild: true
        name: "Release ${{ github.ref_name }}"
        tag: ${{ github.ref_name }}
        token: ${{ secrets.GITHUB_TOKEN }}
